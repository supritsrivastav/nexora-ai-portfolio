services:
  - type: web
    name: nexora-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-1}
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: RATE_LIMIT_BACKEND
        value: redis
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: DB_SSLMODE
        value: require
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
